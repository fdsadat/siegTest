name: fiscal-documents
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run scripts/New-DevEnvironment.ps1}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -d master -b -o /dev/null
          -Q "IF DB_ID(N'FiscalDocuments') IS NOT NULL AND ISNULL(HAS_DBACCESS(N'FiscalDocuments'), 0) <> 1
          THROW 51000, 'FiscalDocuments is not accessible yet.', 1; SELECT 1;"
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  rabbit:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: fiscal_app
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Run scripts/New-DevEnvironment.ps1}
    ports: ["127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  migrate:
    build: { context: ., target: api }
    command: ["--migrate"]
    environment:
      ConnectionStrings__SqlServer: "Server=sql;Database=FiscalDocuments;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=true"
      Database__ApplicationPassword: ${SQL_APP_PASSWORD}
      Logging__LogLevel__Microsoft.EntityFrameworkCore: None
    depends_on:
      sql: { condition: service_healthy }
  api:
    build: { context: ., target: api }
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__SqlServer: "Server=sql;Database=FiscalDocuments;User Id=fiscal_app;Password=${SQL_APP_PASSWORD};TrustServerCertificate=true"
      Privacy__HmacKey: ${HMAC_KEY:?Run scripts/New-DevEnvironment.ps1}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Run scripts/New-DevEnvironment.ps1}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    build: { context: ., target: worker }
    environment:
      ConnectionStrings__SqlServer: "Server=sql;Database=FiscalDocuments;User Id=fiscal_app;Password=${SQL_APP_PASSWORD};TrustServerCertificate=true"
      Privacy__HmacKey: ${HMAC_KEY}
      Rabbit__Host: rabbit
      Rabbit__Username: fiscal_app
      Rabbit__Password: ${RABBIT_PASSWORD}
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbit: { condition: service_healthy }
    restart: unless-stopped
volumes:
  sql-data:
  rabbit-data:
